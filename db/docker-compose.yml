services:
  postgres:
    image: postgres:16-alpine
    container_name: bg-automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bg_automation}
      POSTGRES_USER: ${POSTGRES_USER:-bg_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bg_app_local_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bg_pgdata:
